<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do | Mobile- and Web-based Software</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap-theme.min.css">

    <style>
    .custom-navbar {
        border: none;
        padding: 10px 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .navbar-brand {
        font-size: 20px;
        font-weight: 600;
        padding-left: 25px;
        padding-right: 25px;
    }

    .navbar-nav > li > a {
        font-size: 15px;
        padding: 15px 20px;
    }

    .navbar-inverse .navbar-nav > li > a {
        color: #ccc !important;
        background: transparent !important;
    }

    .navbar-inverse .navbar-nav > li > a:hover {
        color: #fff !important;
        font-weight: bold;
    }

    .navbar-inverse .navbar-nav > .active > a,
    .navbar-inverse .navbar-nav > .active > a:focus,
    .navbar-inverse .navbar-nav > .active > a:hover {
        color: #fff !important;
        font-weight: bold;
        background: transparent !important;
    }

    @media (max-width: 767px) {
        .navbar-nav > li > a {
            padding: 10px 15px;
        }
    }
    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>

<div class="container">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-inverse navbar-fixed-top custom-navbar">
        <div class="container-fluid">

            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#main-navbar">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>

                <a class="navbar-brand" href="home.html">My Portal</a>
            </div>

            <div class="collapse navbar-collapse" id="main-navbar">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li class="active"><a href="todo.html">To-Do</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- Push body content down -->
    <div style="margin-top: 90px;"></div>

    <h1 class="jumbotron">To-Do | Mobile- and Web-based Software</h1>

    <ul class="navbar nav nav-pills text-center">
        <li class="todo-tab active" onclick="selectTab(this)" data-tab-name="all">
            <a href="#">All
                <span class="badge"></span>
            </a>
        </li>
        <li class="todo-tab" onclick="selectTab(this)" data-tab-name="active">
            <a href="#">Active
                <span class="badge"></span>
            </a>
        </li>
        <li class="todo-tab" onclick="selectTab(this)" data-tab-name="inactive">
            <a href="#">Inactive
                <span class="badge"></span>
            </a>
        </li>
        <li class="todo-tab" onclick="selectTab(this)" data-tab-name="done">
            <a href="#">Done
                <span class="badge"></span>
            </a>
        </li>
    </ul>

    <div class="list-group" id="todo-list"></div>


    <div class="panel panel-default">
        <div class="panel-heading">
            Add new to-do
        </div>
        <form id="new-todo-form" class="panel-body">
            <div class="input-group">
                <input type="text" id="new-todo-title" class="form-control" placeholder="Type a name for the new to-do..." autocomplete="off"
                    autofocus="true">
                <span class="input-group-btn">
                    <button type="submit" class="btn btn-default">
                        <i class="text-default glyphicon glyphicon-plus"></i>
                    </button>
                </span>
            </div>
        </form>
    </div>

    <script src="todo.js" type="text/javascript"></script>

<footer class="footer text-center">
    <p>
        &copy; <span id="year"></span> Ibrahim • 
        <a href="https://linkedin.com/in/ibrahimify" target="_blank">LinkedIn</a> •
        <a href="https://github.com/ibrahimify" target="_blank">GitHub</a> •
        <a href="https://ibrahimify.tech" target="_blank">Website</a>
    </p>
</footer>

<script>
    document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
